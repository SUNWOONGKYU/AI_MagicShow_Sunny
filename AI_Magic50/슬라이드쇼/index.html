<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>SUNNY AI MAGIC 50 — 4,000+시간 AI 활용 실전 경험</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden;color:#fff}

#slide-wrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#111;overflow:hidden}

/* 본문 항목 슬라이드 */
.slide-item{width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;padding:24px 60px 18px}
.slide-item.active{display:flex}
.slide-item .item-head{text-align:center;max-width:98%;margin-bottom:14px}
.slide-item .item-group{display:inline-block;background:#FF8C00;color:#001020;padding:4px 14px;border-radius:18px;font-size:12px;font-weight:900;letter-spacing:1px;margin-bottom:8px}
.slide-item .item-patent{display:inline-block;background:#3498DB;color:#fff;padding:4px 12px;border-radius:18px;font-size:11px;font-weight:900;letter-spacing:0.5px;margin-bottom:8px;margin-left:8px}
.slide-item .item-title{font-size:36px;font-weight:900;color:#fff;line-height:1.25;text-shadow:0 2px 12px rgba(255,140,0,0.3)}
.slide-item .item-title .acc{color:#FF8C00;margin-right:12px}
.slide-item .item-sub{margin-top:14px;font-size:18px;font-weight:600;color:#FF8C00;line-height:1.4;opacity:0.95;white-space:nowrap}
.slide-item .item-img{max-width:70%;max-height:42%;object-fit:contain;border-radius:12px;box-shadow:0 16px 50px rgba(0,0,0,0.6);margin-top:10px}
.slide-item .item-num{position:absolute;top:18px;right:30px;font-size:50px;font-weight:900;color:rgba(255,140,0,0.22);font-family:'Arial Black',sans-serif}
.slide-item .item-copy{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#7a8c9c;font-size:12px;letter-spacing:0.3px;opacity:0.85;z-index:5;background:rgba(0,8,20,0.6);padding:4px 0}

/* 표지 슬라이드 */
.slide-cover{width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#002d5c 0%,#000814 70%);position:relative}
.slide-cover.active{display:flex}
.slide-cover .cover-tag{color:#FF8C00;font-size:18px;font-weight:900;letter-spacing:8px;margin-bottom:18px}
.slide-cover .cover-title{font-weight:900;color:#fff;text-align:center;line-height:1.15;letter-spacing:-2px;text-shadow:0 4px 28px rgba(255,140,0,0.4)}
.slide-cover .cover-title{display:flex;flex-direction:column;align-items:center;justify-content:center}
.slide-cover .cover-title .line-brand{font-size:96px;display:block;letter-spacing:2px;line-height:1.0;text-align:center;white-space:nowrap;font-weight:900}
.slide-cover .cover-title .line-sub{font-size:48px;display:block;margin-top:36px;font-weight:800;color:#FF8C00;letter-spacing:1px;text-align:center;white-space:nowrap}
.slide-cover .cover-title .line-tag{font-size:22px;display:block;margin-top:22px;font-weight:600;color:#FF8C00;opacity:0.8;letter-spacing:2px;text-align:center;white-space:nowrap}
.slide-cover .cover-title .accent{color:#FF8C00}
.slide-cover .cover-copy{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#7a8c9c;font-size:13px;letter-spacing:0.5px;opacity:0.85}
.slide-copyright{width:100%;height:100%;display:none;flex-direction:column;background:#001020;color:#dde;padding:36px 48px;overflow-y:auto;position:relative}
.slide-copyright.active{display:flex}
.slide-copyright .cr-title{font-size:28px;font-weight:900;color:#FF8C00;text-align:center;margin-bottom:20px;letter-spacing:0.5px;border-bottom:2px solid rgba(255,140,0,0.3);padding-bottom:14px}
.slide-copyright .cr-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.slide-copyright .cr-row{display:flex;gap:14px;font-size:14px;line-height:1.6}
.slide-copyright .cr-label{flex:0 0 90px;color:#FF8C00;font-weight:900;letter-spacing:0.5px}
.slide-copyright .cr-value{color:#dde;flex:1}
.slide-copyright .cr-box{background:rgba(255,140,0,0.06);border:1px solid rgba(255,140,0,0.25);border-radius:10px;padding:16px 20px;margin-bottom:16px}
.slide-copyright .cr-box-title{color:#FF8C00;font-weight:900;font-size:15px;margin-bottom:10px;letter-spacing:0.3px}
.slide-copyright .cr-list{display:flex;flex-direction:column;gap:5px}
.slide-copyright .cr-li{font-size:14px;color:#dde}
.slide-copyright .cr-li.ok{color:#3fb950}
.slide-copyright .cr-li.no{color:#ff7b72}
.slide-copyright .cr-patents{display:flex;flex-direction:column;gap:4px}
.slide-copyright .cr-pat-head{color:#FF8C00;font-weight:900;font-size:13px;letter-spacing:1px;margin-bottom:4px;text-transform:uppercase}
.slide-copyright .cr-pat{font-size:13px;color:#dde;line-height:1.5;padding-left:6px}
.slide-copyright .cr-pat b{color:#fff;font-family:'D2Coding','Consolas',monospace;font-weight:900;margin-right:8px}
.slide-copyright .cr-pat .cr-pat-ch{color:#7a8c9c;font-size:12px;margin-left:6px}
.slide-copyright .cr-note{font-size:12px;color:#ffa657;margin-top:10px;font-style:italic}
@media (max-width:768px){
  .slide-copyright{padding:24px 18px}
  .slide-copyright .cr-title{font-size:20px}
  .slide-copyright .cr-row{flex-direction:column;gap:2px}
  .slide-copyright .cr-label{flex:0 0 auto}
  .slide-copyright .cr-pat{font-size:12px}
}

/* 목차 슬라이드 */
.slide-toc{width:100%;height:100%;display:none;flex-direction:column;align-items:center;padding:30px 50px;background:linear-gradient(135deg,#001a3a 0%,#000814 100%);overflow-y:auto}
.slide-toc.active{display:flex}
.slide-toc h2{color:#FF8C00;font-size:32px;font-weight:900;margin-bottom:18px;letter-spacing:2px}
.toc-groups{width:100%;max-width:1500px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}
.toc-group{background:rgba(255,140,0,0.06);border:1.5px solid rgba(255,140,0,0.3);border-radius:10px;padding:12px 14px}
.toc-group h3{color:#FF8C00;font-size:15px;font-weight:900;margin-bottom:8px;border-bottom:1px solid rgba(255,140,0,0.3);padding-bottom:5px;display:flex;justify-content:space-between}
.toc-group h3 .count{font-size:12px;opacity:0.8}
.toc-item{display:block;color:#dde;font-size:13px;padding:4px 7px;border-radius:5px;cursor:pointer;line-height:1.3;text-decoration:none;transition:all 0.15s}
.toc-item:hover{background:rgba(255,140,0,0.2);color:#FF8C00;transform:translateX(2px)}
.toc-item .num{color:#FF8C00;font-weight:900;display:inline-block;width:30px}

/* 감사 + 명함 슬라이드 */
.slide-thanks{width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#002d5c 0%,#000814 70%);position:relative;padding:30px;gap:32px}
.slide-thanks.active{display:flex}
.slide-thanks .thanks-title{font-size:88px;font-weight:900;color:#fff;letter-spacing:8px;text-shadow:0 4px 28px rgba(255,140,0,0.45);margin-bottom:8px}
.slide-thanks .thanks-sub{font-size:22px;color:#FF8C00;letter-spacing:3px;font-weight:800;margin-bottom:18px}
.namecard{background:#f9f8f4;color:#111;width:min(820px,92vw);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,0.55),0 0 0 1px rgba(255,140,0,0.25);padding:28px 36px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.namecard .nc-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,0,0,0.08);padding-bottom:12px}
.namecard .nc-sunmyung{font-family:'Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:300;color:#1a1a1a;letter-spacing:1px}
.namecard .nc-axon{font-family:'Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:700;color:#1a1a1a;letter-spacing:0.5px}
.namecard .nc-axon span{color:#e8920d}
.namecard .nc-mid{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.namecard .nc-left{display:flex;flex-direction:column;gap:6px}
.namecard .nc-title-label{font-size:13px;color:#888;letter-spacing:0.3px}
.namecard .nc-name{font-size:38px;font-weight:800;color:#111;letter-spacing:12px;line-height:1.15}
.namecard .nc-right{display:flex;flex-direction:column;align-items:flex-end;text-align:right;font-family:'Helvetica Neue',Arial,sans-serif}
.namecard .nc-company{font-size:15px;font-weight:700;color:#111;margin-bottom:10px}
.namecard .nc-item{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.namecard .nc-l{font-size:11px;color:#aaa;min-width:48px;text-align:right}
.namecard .nc-v{font-size:13px;color:#222}
.namecard .nc-addr{font-size:11px;color:#666;margin-top:6px;line-height:1.6;text-align:right}
.namecard .nc-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(0,0,0,0.08);padding-top:12px}
.namecard .nc-tags{display:inline-flex;align-items:center;gap:8px;background:#2e2e2e;border-radius:4px;padding:6px 14px}
.namecard .nc-tags span{font-size:11px;color:#ccc;letter-spacing:1px}
.namecard .nc-tags .sep{color:#666}
.namecard .nc-catch{font-size:12px;color:#666;letter-spacing:0.5px;font-family:'Helvetica Neue',Arial,sans-serif}
.namecard .nc-catch b{color:#e8920d;font-weight:700}
@media(max-width:760px){
  .slide-thanks .thanks-title{font-size:52px;letter-spacing:4px}
  .slide-thanks .thanks-sub{font-size:14px;letter-spacing:2px}
  .namecard{padding:18px 18px}
  .namecard .nc-mid{flex-direction:column;align-items:flex-start;gap:14px}
  .namecard .nc-right{align-items:flex-start;text-align:left}
  .namecard .nc-item{justify-content:flex-start}
  .namecard .nc-l{min-width:54px;text-align:left}
  .namecard .nc-addr{text-align:left}
  .namecard .nc-name{font-size:28px;letter-spacing:8px}
  .namecard .nc-bottom{flex-direction:column;gap:10px;align-items:flex-start}
}

/* 화살표 */
.arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.45);
  border:none;color:#FF8C00;font-size:38px;cursor:pointer;padding:18px 10px;
  z-index:10;border-radius:6px;transition:background 0.2s;line-height:1}
.arrow:hover{background:rgba(255,140,0,0.35)}
#arr-l{left:0}
#arr-r{right:0}

/* 링크 패널 */
#link-panel{background:linear-gradient(135deg,#001a3a,#002d5c);border-top:3px solid #FF8C00;padding:12px 24px;display:none;flex-direction:column;align-items:center;gap:8px;flex-shrink:0}
#link-panel.show{display:flex}
#link-panel .lp-head{display:flex;align-items:center;gap:8px;color:#FF8C00;font-size:14px;font-weight:900;letter-spacing:1px}
#link-panel .lp-head .arrow-down{font-size:18px;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
#link-panel .lp-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#link-panel a{color:#fff;background:rgba(52,152,219,0.25);border:2px solid #3498DB;text-decoration:none;font-size:14px;font-weight:700;padding:7px 18px;border-radius:24px;white-space:nowrap;transition:all 0.2s}
#link-panel a:hover{background:#3498DB;transform:scale(1.05);box-shadow:0 0 14px rgba(52,152,219,0.7)}

/* 하단 네비 */
#nav{background:#001020;border-top:1px solid #1a2a3a;padding:10px 20px;display:flex;align-items:center;justify-content:center;gap:20px;flex-shrink:0}
.nav-btn{background:none;border:2px solid #FF8C00;color:#FF8C00;padding:6px 24px;border-radius:20px;cursor:pointer;font-size:14px;font-weight:700;transition:all 0.2s;font-family:inherit}
.nav-btn:hover{background:#FF8C00;color:#001020}
.nav-btn:disabled{border-color:#333;color:#333;cursor:default}
#counter{color:#ccc;font-size:14px;min-width:90px;text-align:center;font-weight:700}
#today{color:#FF8C00;font-size:12px;font-weight:700;letter-spacing:1px}
#progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,#FF8C00,#FFD700);transition:width 0.3s;z-index:100}

@media(max-width:900px){
  .slide-cover .cover-title .line-brand{font-size:54px;letter-spacing:1px}
  .slide-cover .cover-title .line-sub{font-size:20px;margin-top:24px}
  .slide-cover .cover-title .line-tag{font-size:13px;margin-top:14px;letter-spacing:1px}
  .slide-item .item-title{font-size:22px;line-height:1.3}
  .slide-item .item-sub{font-size:11px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toc-groups{grid-template-columns:1fr}
  .slide-item{padding:20px 30px}
}
</style>
</head>
<body>
<div id="progress"></div>

<div id="slide-wrap">
  <button class="arrow" id="arr-l" onclick="go(-1)">&#10094;</button>

</div>

<div id="link-panel">

</div>

  });

  var html = '<h2>📋 목차</h2><div class="toc-groups">';
  Object.keys(groups).sort().forEach(function(g) {
    var grp = groups[g];
    html += '<div class="toc-group"><h3>G' + g + ' ' + grp.name + '<span class="count">' + grp.items.length + '개</span></h3>';
    grp.items.forEach(function(x) {
      html += '<a class="toc-item" onclick="jump(' + x.idx + ')"><span class="num">#' + ('0'+x.item.id).slice(-2) + '</span>' + (x.item.title || x.item.short) + '</a>';
    });
    html += '</div>';
  });
  html += '</div>';
  return '<div class="slide-toc active">' + html + '</div>';
}

function renderItem(itemIdx) {
  var it = ITEMS[itemIdx];
  var pad = ('0' + it.id).slice(-2);
  var imgHtml;
  if (it.placeholder) {
    imgHtml = '<div class="item-img" style="width:60%;height:50%;display:flex;align-items:center;justify-content:center;border:3px dashed #FF8C00;background:rgba(255,140,0,0.05);color:#FF8C00;font-size:26px;font-weight:900;letter-spacing:2px">Coming Soon</div>';
  } else {
    imgHtml = '<img class="item-img" src="' + IMG_BASE + pad + '.png" alt="#' + pad + '" onerror="this.style.opacity=0.2">';
  }
  var patentBadge = it.patent ? '<span class="item-patent">📜 특허 출원</span>' : '';
  return '<div class="slide-item active">' +
    '<div class="item-num">#' + pad + '</div>' +
    '<div class="item-head">' +
      '<span class="item-group">G' + it.gid + ' · ' + it.gname + '</span>' + patentBadge +
      '<div class="item-title"><span class="acc">#' + pad + '</span>' + it.title + '</div>' +
      (it.sub ? '<div class="item-sub">' + it.sub + '</div>' : '') +
    '</div>' +
    imgHtml +
    '<div class="item-copy">© 2026 SUN WOONGKYU · SUNNY AI MAGIC 50 · CC BY-NC-ND 4.0 · 특허 별도 보유</div>' +
    '</div>';
}

    '</div>';

function updateSlide() {
  var html;
  if (cur === 1) html = renderCover();
  else if (cur === 2) html = renderTOC();
  else if (cur === TOTAL - 1) html = renderCopyright();
  else if (cur === TOTAL) html = renderThanks();
  else html = renderItem(cur - 3);

  host.innerHTML = html;
  counter.textContent = cur + ' / ' + TOTAL;
  progress.style.width = (cur / TOTAL * 100) + '%';
  btnP.disabled = (cur === 1);
  btnN.disabled = (cur === TOTAL);

  // 표지: 메인 타이틀 가로 길이를 부제목에 맞춤 (브랜드를 줄여서 맞춤)
  if (cur === 1) {
    requestAnimationFrame(function() {
      var brand = host.querySelector('.line-brand');
      var sub = host.querySelector('.line-sub');
      if (brand && sub) {
        var brandW = brand.getBoundingClientRect().width;
        var subW = sub.getBoundingClientRect().width;
        if (subW > 0 && brandW > 0) {
          var curSize = parseFloat(getComputedStyle(brand).fontSize);
          brand.style.fontSize = (curSize * subW / brandW) + 'px';
        }
      }
    });
  }

  // 링크 패널: 본문 항목 슬라이드에만 적용 (EXTRA_LINKS에 있으면)
  var extraLinks = null;
  if (cur >= 3 && cur < TOTAL - 1) {
    var it = ITEMS[cur - 3];
    var customLinks = EXTRA_LINKS[it.id];
    if (customLinks) extraLinks = customLinks;
  }

  if (extraLinks && extraLinks.length > 0) {
    lpBtns.innerHTML = extraLinks.map(function(l) {
      return '<a href="' + l.url + '" target="_blank" rel="noopener noreferrer">' + l.text + '</a>';
    }).join('');
    linkPanel.classList.add('show');
  } else {
    lpBtns.innerHTML = '';
    linkPanel.classList.remove('show');
  }
}

function go(dir) {
  var next = cur + dir;
  if (next < 1 || next > TOTAL) return;
  cur = next;
  updateSlide();
}

function jump(n) {
  if (n < 1 || n > TOTAL) return;
  cur = n;
  updateSlide();
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'Home') { cur = 1; updateSlide(); }
  if (e.key === 'End') { cur = TOTAL; updateSlide(); }
});

var tx = 0;
document.addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; },{passive:true});
document.addEventListener('touchend', function(e){
  var dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
});

updateSlide();
var d=new Date();
document.getElementById('today').textContent = d.getFullYear()+'.'+(d.getMonth()+1).toString().padStart(2,'0')+'.'+d.getDate().toString().padStart(2,'0');
</script>
