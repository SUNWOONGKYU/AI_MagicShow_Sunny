      <stop offset="0%" stop-color="#001a3a"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF8C00"/>
    </marker>
  </defs>
  <rect width="1200" height="740" fill="url(#bg)"/>
  <text x="600" y="44" font-size="26" font-weight="900" fill="#FF8C00" text-anchor="middle">YouTube 영상 제작 — 2 Track + 1 Engine</text>
  <text x="600" y="72" font-size="13" fill="#bcd" text-anchor="middle">Plan-A 벤치마크형 / Plan-B 원본형 → 공통 Produce 엔진 → MBO 6기준 검증 → 배포</text>

  <!-- Phase 1: PLAN -->
  <rect x="40" y="100" width="540" height="380" rx="14" fill="rgba(52,152,219,0.06)" stroke="#3498DB" stroke-width="1.5"/>
