  <text x="80" y="578" font-size="10" fill="#bcd">→ MLLM 채점 → 채택 → 일괄</text>

  <text x="300" y="560" font-size="12" font-weight="900" fill="#fff">이미지 소스</text>
  <text x="300" y="578" font-size="10" fill="#bcd">Gemini Image Preview + DALL-E 3 + ...</text>

