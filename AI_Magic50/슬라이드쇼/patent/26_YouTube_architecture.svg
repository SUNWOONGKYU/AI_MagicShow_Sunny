  <text x="655" y="382" font-size="10" fill="#fff">Hook BPI(Buzz Performance Index) + BGM</text>

  <rect x="640" y="396" width="500" height="48" rx="6" fill="rgba(63,185,80,0.15)"/>
  <text x="655" y="416" font-size="12" font-weight="900" fill="#fff">S6 YouTube 배포</text>
  <text x="655" y="434" font-size="10" fill="#bcd">영문 SRT 4단계 업로드 (한글 SRT 금지)</text>

