<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#001a3a"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF8C00"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="46" font-size="26" font-weight="900" fill="#FF8C00" text-anchor="middle">MBO — Management by Objectives</text>
  <text x="600" y="74" font-size="14" fill="#bcd" text-anchor="middle">목표는 합의하면 무조건 달성 · 과정은 자율 · 품질 최고 · 비용 합리</text>

  <!-- PHASE 1 -->
  <rect x="40" y="110" width="360" height="540" rx="14" fill="rgba(52,152,219,0.08)" stroke="#3498DB" stroke-width="1.5"/>
  <text x="220" y="140" font-size="17" font-weight="900" fill="#3498DB" text-anchor="middle">PHASE 1 — 목표 정의</text>
  <text x="220" y="160" font-size="12" fill="#7fbfff" text-anchor="middle">AI 수행</text>

  <rect x="65" y="180" width="310" height="58" rx="8" fill="rgba(52,152,219,0.15)" stroke="#3498DB"/>
  <text x="80" y="206" font-size="13" font-weight="900" fill="#fff">① 맥락 분석</text>
  <text x="80" y="225" font-size="11" fill="#bcd">무엇을·왜·범위 파악</text>

  <rect x="65" y="248" width="310" height="58" rx="8" fill="rgba(52,152,219,0.15)" stroke="#3498DB"/>
  <text x="80" y="274" font-size="13" font-weight="900" fill="#fff">② AS-IS 조사</text>
  <text x="80" y="293" font-size="11" fill="#bcd">코드·파일·배포 상태 확인</text>

  <rect x="65" y="316" width="310" height="58" rx="8" fill="rgba(52,152,219,0.15)" stroke="#3498DB"/>
  <text x="80" y="342" font-size="13" font-weight="900" fill="#fff">③ TO-BE 정의</text>
  <text x="80" y="361" font-size="11" fill="#bcd">구체적·측정 가능</text>

  <rect x="65" y="384" width="310" height="58" rx="8" fill="rgba(52,152,219,0.15)" stroke="#3498DB"/>
  <text x="80" y="410" font-size="13" font-weight="900" fill="#fff">④ KPI 설정</text>
  <text x="80" y="429" font-size="11" fill="#bcd">"Lighthouse 80점 이상" 수치화</text>

  <rect x="65" y="452" width="310" height="58" rx="8" fill="rgba(52,152,219,0.15)" stroke="#3498DB"/>
  <text x="80" y="478" font-size="13" font-weight="900" fill="#fff">⑤ Task 목록 도출</text>
  <text x="80" y="497" font-size="11" fill="#bcd">목표 달성에 필요한 작업</text>

  <rect x="65" y="528" width="310" height="80" rx="10" fill="rgba(255,140,0,0.18)" stroke="#FF8C00" stroke-width="2"/>
  <text x="220" y="558" font-size="14" font-weight="900" fill="#FF8C00" text-anchor="middle">PO 승인 = 합의</text>
  <text x="220" y="582" font-size="11" fill="#fff" text-anchor="middle">승인 없이 작업 시작 절대 금지</text>
  <text x="220" y="600" font-size="11" fill="#bcd" text-anchor="middle">수정 요청 시 재제시</text>

  <!-- arrow -->
  <line x1="400" y1="570" x2="430" y2="570" stroke="#FF8C00" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- PHASE 2 -->
  <rect x="440" y="110" width="320" height="540" rx="14" fill="rgba(155,89,182,0.08)" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="600" y="140" font-size="17" font-weight="900" fill="#9b59b6" text-anchor="middle">PHASE 2 — 실행</text>
  <text x="600" y="160" font-size="12" fill="#c39bd3" text-anchor="middle">승인 후 자율 실행</text>

  <rect x="465" y="190" width="270" height="80" rx="8" fill="rgba(155,89,182,0.15)" stroke="#9b59b6"/>
  <text x="480" y="216" font-size="13" font-weight="900" fill="#fff">⑥ MBO 파일 저장</text>
  <text x="480" y="234" font-size="10" fill="#bcd">_TalkTodoPlan/</text>
  <text x="480" y="250" font-size="10" fill="#bcd">YYYY_MM_DD__HH.MM_MBO_{작업명}.md</text>

  <rect x="465" y="285" width="270" height="100" rx="8" fill="rgba(155,89,182,0.15)" stroke="#9b59b6"/>
  <text x="480" y="311" font-size="13" font-weight="900" fill="#fff">⑦ Task 실행 (자율)</text>
  <text x="480" y="330" font-size="11" fill="#bcd">· SAL Grid: 6단계 루프</text>
  <text x="480" y="348" font-size="11" fill="#bcd">· 일반: 작업→검증→기록</text>
  <text x="480" y="368" font-size="11" fill="#fde">PO 과정 간섭 금지</text>

  <rect x="465" y="400" width="270" height="78" rx="8" fill="rgba(155,89,182,0.15)" stroke="#9b59b6"/>
  <text x="480" y="426" font-size="13" font-weight="900" fill="#fff">⑧ 중간 점검 (선택)</text>
  <text x="480" y="444" font-size="11" fill="#bcd">대규모 작업 시</text>
  <text x="480" y="462" font-size="11" fill="#bcd">KPI 달성률 보고</text>

  <rect x="465" y="495" width="270" height="135" rx="8" fill="rgba(155,89,182,0.10)" stroke="#9b59b6" stroke-dasharray="4 4"/>
  <text x="600" y="520" font-size="12" font-weight="900" fill="#FF8C00" text-anchor="middle">자율과 책임의 원칙</text>
  <text x="600" y="542" font-size="11" fill="#fff" text-anchor="middle">자율: 방법은 AI가 선택</text>
  <text x="600" y="560" font-size="11" fill="#fff" text-anchor="middle">책임: 합의 목표 무조건 달성</text>
  <text x="600" y="578" font-size="11" fill="#fff" text-anchor="middle">품질: 최고 / 비용: 합리</text>
  <text x="600" y="596" font-size="11" fill="#fff" text-anchor="middle">시간: 적절하게</text>
  <text x="600" y="614" font-size="11" fill="#bcd" font-style="italic" text-anchor="middle">"변명이 아니라 결과로 보고"</text>

  <line x1="760" y1="370" x2="790" y2="370" stroke="#FF8C00" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- PHASE 3 -->
  <rect x="800" y="110" width="360" height="540" rx="14" fill="rgba(63,185,80,0.08)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="980" y="140" font-size="17" font-weight="900" fill="#3fb950" text-anchor="middle">PHASE 3 — 결과 보고</text>
  <text x="980" y="160" font-size="12" fill="#7fdc7f" text-anchor="middle">/mbo report</text>

  <rect x="825" y="180" width="310" height="100" rx="8" fill="rgba(63,185,80,0.15)" stroke="#3fb950"/>
  <text x="840" y="206" font-size="13" font-weight="900" fill="#fff">⑨ AS-IS → TO-BE → 실제</text>
  <text x="840" y="226" font-size="11" fill="#bcd">목표 항목별 달성 여부 대조</text>
  <text x="840" y="244" font-size="11" fill="#bcd">| AS-IS | TO-BE | 실제 | O/X |</text>
  <text x="840" y="262" font-size="11" fill="#bcd">"뭘 했다"가 아니라 "달성/미달"</text>

  <rect x="825" y="290" width="310" height="78" rx="8" fill="rgba(63,185,80,0.15)" stroke="#3fb950"/>
  <text x="840" y="316" font-size="13" font-weight="900" fill="#fff">⑩ KPI 실측값 보고</text>
  <text x="840" y="334" font-size="11" fill="#bcd">목표값 vs 실측값</text>
  <text x="840" y="352" font-size="11" fill="#bcd">측정 방법 명시</text>

  <rect x="825" y="378" width="310" height="100" rx="8" fill="rgba(63,185,80,0.15)" stroke="#3fb950"/>
  <text x="840" y="404" font-size="13" font-weight="900" fill="#fff">⑪ 미달성 사유 + 후속</text>
  <text x="840" y="422" font-size="11" fill="#bcd">실패도 기록해야</text>
  <text x="840" y="440" font-size="11" fill="#bcd">다음에 반복 안 함</text>
  <text x="840" y="460" font-size="11" fill="#bcd">| 항목 | 사유 | 후속 조치 |</text>

  <rect x="825" y="488" width="310" height="80" rx="8" fill="rgba(255,140,0,0.18)" stroke="#FF8C00" stroke-width="2"/>
  <text x="980" y="516" font-size="14" font-weight="900" fill="#FF8C00" text-anchor="middle">⑫ PO 최종 확인</text>
  <text x="980" y="538" font-size="11" fill="#fff" text-anchor="middle">결과 파일에 보고 섹션 추가</text>
  <text x="980" y="556" font-size="11" fill="#bcd" text-anchor="middle">MBO 사이클 종료</text>

  <rect x="825" y="580" width="310" height="50" rx="6" fill="rgba(63,185,80,0.05)" stroke="#3fb950" stroke-dasharray="3 3"/>
  <text x="980" y="600" font-size="11" font-weight="900" fill="#3fb950" text-anchor="middle">PO 철학</text>
  <text x="980" y="618" font-size="10" fill="#bcd" text-anchor="middle" font-style="italic">"과정 자유, 목표 무조건 달성"</text>
</svg>
